<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우쿨렐레 악보 편집기</title>

<style>
:root{--ink:#1a1410;--paper:#fff;--warm:#f8f4ee;--rule:#ccc;--amber:#b8620a;--muted:#8a7d6e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0ead8;color:var(--ink);font-family:-apple-system,Helvetica Neue,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:#1a1410;color:#faf7f2;padding:.8rem 1.4rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{font-family:Georgia,serif;font-size:1.1rem;font-weight:700;color:#e07c1a}
.hact{margin-left:auto;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.btn{font-family:Menlo,monospace;font-size:.65rem;padding:.38rem .85rem;border-radius:4px;cursor:pointer;border:1.5px solid transparent;transition:all .14s}
.btn-p{background:#b8620a;color:#fff;border-color:#b8620a;font-weight:700}
.btn-p:hover{background:#e07c1a}
.btn-g{background:transparent;border-color:#3a3028;color:#c8b89a}
.btn-g:hover{border-color:#e07c1a;color:#e07c1a}
.btn-sm{font-size:.6rem;padding:.25rem .6rem}
.editor{display:grid;grid-template-columns:260px 1fr;flex:1;gap:0}
.palette{background:#f5ede0;border-right:1px solid #d8cfc0;padding:1rem;display:flex;flex-direction:column;gap:.8rem;overflow-y:auto}
.ptitle{font-family:Menlo,monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:#8a7d6e;border-bottom:1px solid #d8cfc0;padding-bottom:.35rem}
.chord-palette{display:flex;flex-wrap:wrap;gap:.5rem}
.pc{background:#fff;border:1.5px solid #d8cfc0;border-radius:6px;padding:5px 6px 4px;cursor:pointer;transition:all .13s;text-align:center;user-select:none}
.pc:hover{border-color:#b8620a;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pc-name{font-family:Georgia,serif;font-size:.95rem;font-weight:700;color:#1a1410;line-height:1.1}
.pc-tens{font-family:Menlo,monospace;font-size:.5rem;color:#b8620a}
.empty-p{font-family:Menlo,monospace;font-size:.7rem;color:#d8cfc0;text-align:center;padding:1rem}
.score-edit{padding:1rem 1.2rem;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem}
.score-meta{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #d8cfc0;border-radius:6px;padding:.6rem .8rem}
.score-meta label{font-family:Menlo,monospace;font-size:.58rem;color:#8a7d6e;letter-spacing:.08em}
.score-meta input,.score-meta select{font-family:-apple-system,Helvetica Neue,Arial,sans-serif;font-size:.78rem;border:1px solid #d8cfc0;border-radius:4px;padding:.28rem .5rem;background:#faf7f2;color:#1a1410;outline:none}
.score-meta input:focus,.score-meta select:focus{border-color:#b8620a}
.stitle-in{width:180px!important}
.score-rows{display:flex;flex-direction:column;gap:.5rem}
.score-row{background:#fff;border:1px solid #d8cfc0;border-radius:6px;padding:.5rem .6rem;position:relative}
.row-label{font-family:Menlo,monospace;font-size:.55rem;color:#b0a090;margin-bottom:.3rem}
.measures-edit{display:flex;gap:4px;align-items:stretch}
.measure-edit{flex:1;border:1.5px solid #e0d8cc;border-radius:5px;padding:5px 5px 4px;background:#fdf9f4;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.me-chord-row{display:flex;align-items:center;gap:3px}
.me-chord-sel{flex:1;font-family:Menlo,monospace;font-size:.56rem;background:#fff;border:1px solid #d8cfc0;border-radius:3px;padding:.18rem .3rem;color:#1a1410;outline:none;min-width:0}
.me-diag{flex-shrink:0}
.me-lyric{width:100%;font-family:-apple-system,Helvetica Neue,Arial,sans-serif;font-size:.78rem;background:#fff;border:1px solid #d8cfc0;border-radius:3px;padding:.2rem .4rem;color:#1a1410;outline:none}
.me-lyric:focus{border-color:#b8620a}
.me-del{position:absolute;top:2px;right:3px;background:transparent;border:none;color:#d8cfc0;font-size:.65rem;cursor:pointer;line-height:1;padding:1px}
.me-del:hover{color:#cc3333}
.me-num{font-family:Menlo,monospace;font-size:.5rem;color:#c0b0a0;margin-bottom:1px}
.row-actions{display:flex;gap:.35rem;margin-top:.3rem;justify-content:flex-end}
#previewPanel{display:none;background:#f0ead8;padding:1rem 1.2rem}
#previewPanel.show{display:block}
.preview-info{font-family:-apple-system,Helvetica Neue,Arial,sans-serif;font-size:.75rem;color:#b8620a;font-weight:700;margin-bottom:6px}
.pov{display:none;position:fixed;inset:0;background:rgba(14,10,8,.8);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:.8rem}
.pov.show{display:flex}
.pspinner{width:34px;height:34px;border:3px solid #2a2018;border-top-color:#e07c1a;border-radius:50%;animation:spin .7s linear infinite}
.pmsg2{font-family:Menlo,monospace;font-size:.72rem;color:#c8b89a}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.editor{grid-template-columns:1fr}.palette{border-right:none;border-bottom:1px solid #d8cfc0;max-height:200px}}
</style>
</head>
<body>

<div class="pov" id="pov"><div class="pspinner"></div><div class="pmsg2" id="pmsg">생성 중...</div></div>

<header>
  <div class="logo">🎵 악보 편집기</div>
  <div class="hact">
    <button class="btn btn-g" onclick="addRow()">＋ 행 추가</button>
    <button class="btn btn-p" onclick="genPreview()">🖼 악보 미리보기</button>
  </div>
</header>

<div class="editor">
  <div class="palette">
    <div class="ptitle">코드 팔레트</div>
    <div class="ptitle" style="margin-top:.3rem;border:none;padding:0;font-size:.54rem;color:#b0a090">탭해서 마디에 추가</div>
    <div class="chord-palette" id="chordPalette">
      <div class="empty-p">아래에서 코드를 만들어주세요</div>
    </div>

    <div class="ptitle" style="margin-top:.5rem">직접 코드명 입력</div>
    <div style="display:flex;gap:.4rem;align-items:center">
      <input type="text" id="manualChordName" placeholder="예: Am7, G, F#m"
        style="flex:1;font-family:Menlo,monospace;font-size:.75rem;padding:.3rem .5rem;border:1px solid #d8cfc0;border-radius:4px;background:#fff;color:#1a1410;outline:none">
      <button class="btn btn-p btn-sm" onclick="addManualChord()">추가</button>
    </div>
    <div style="font-family:Menlo,monospace;font-size:.54rem;color:#b0a090;margin-top:.2rem">다이어그램 없이 코드명만 표시됩니다</div>

    <div class="ptitle" style="margin-top:.6rem">다이어그램 직접 그리기</div>
    <div id="miniEditorWrap" style="background:#fff;border:1px solid #d8cfc0;border-radius:6px;padding:7px">
      <div style="display:flex;gap:.4rem;align-items:center;margin-bottom:5px;flex-wrap:wrap">
        <input type="text" id="miniChordName" placeholder="코드명 (예: Am)"
          style="width:80px;font-family:Menlo,monospace;font-size:.72rem;padding:.25rem .4rem;border:1px solid #d8cfc0;border-radius:3px;background:#faf7f2;color:#1a1410;outline:none">
        <select id="miniStartFret" style="font-family:Menlo,monospace;font-size:.65rem;padding:.22rem .3rem;border:1px solid #d8cfc0;border-radius:3px;background:#faf7f2;color:#1a1410;outline:none">
          <option value="1">1fr</option><option value="2">2fr</option><option value="3">3fr</option>
          <option value="4">4fr</option><option value="5">5fr</option><option value="7">7fr</option>
          <option value="9">9fr</option>
        </select>
        <button class="btn btn-sm" data-m="dot" onclick="setMiniMode('dot',this)" style="background:#1a1410;color:#fff;border-color:#1a1410">●점</button>
        <button class="btn btn-sm" data-m="tension" onclick="setMiniMode('tension',this)" style="background:transparent;border-color:#d8cfc0;color:#8a7d6e">T텐션</button>
        <button class="btn btn-sm" data-m="erase" onclick="setMiniMode('erase',this)" style="background:transparent;border-color:#d8cfc0;color:#8a7d6e">✕지우기</button>
      </div>
      <div style="display:flex;gap:4px;align-items:center;margin-bottom:4px">
        <span style="font-family:Menlo,monospace;font-size:.55rem;color:#8a7d6e;min-width:28px">스트링</span>
        <div id="miniSSRow" style="display:flex;gap:4px"></div>
      </div>
      <div id="miniSvgWrap" style="display:flex;justify-content:center"></div>
      <button class="btn btn-p btn-sm" onclick="saveMiniChord()" style="width:100%;margin-top:5px;font-size:.65rem">팔레트에 추가</button>
      <button class="btn btn-sm" onclick="clearMiniDots()" style="width:100%;margin-top:3px;font-size:.6rem;background:transparent;border-color:#d8cfc0;color:#8a7d6e">초기화</button>
    </div>
  </div>

  <div class="score-edit">
    <div class="score-meta">
      <label>제목</label>
      <input class="stitle-in" type="text" id="scoreTitle" placeholder="악보 제목 (예: 헤픈 우연)">
      <label>아티스트</label>
      <input type="text" id="scoreArtist" placeholder="아티스트" style="width:100px">
      <label>박자</label>
      <select id="timeSig">
        <option value="4">4/4</option>
        <option value="3">3/4</option>
      </select>
    </div>
    <div class="score-rows" id="scoreRows"></div>
    <button class="btn btn-g" onclick="addRow()" style="align-self:flex-start">＋ 행 추가 (4마디)</button>
  </div>
</div>

<div id="previewPanel">
  <div class="preview-info">↓ 이미지를 꾹 눌러 → 사진 저장 / 파일에 저장</div>
</div>

<script>
const STR=['A','E','C','G'],FC=4,PM=[3,5,7,10,12,15],DM=12;
const SW=200,SH=110,ML=32,MR=10,MT=12,MB=28;
const BW=SW-ML-MR,BH=SH-MT-MB,CW=BW/FC,RH=BH/3;
let chords=[],rows=[];

function loadFromBuilder(){
  try{const raw=localStorage.getItem('uke_coll');if(raw){const coll=JSON.parse(raw);coll.forEach(e=>{chords.push({key:e.id,name:(e.root||'')+(e.qual||'')+(e.tensions&&e.tensions.length?' '+e.tensions.join(' '):''),hasDiag:true,dots:e.dots,stringStates:e.stringStates,startFret:e.startFret});});}}catch(e){}
}

function mkSVG(dots,ss2,fr,w,h){
  const sx=w/SW,sy=h/SH,ml=ML*sx,mt=MT*sy,bw=w-ml-MR*sx,bh=h-mt-MB*sy,cw=bw/FC,rh=bh/3,dr=7*sx,nw=4.5*sx;
  const SY=s=>mt+s*rh,FCX=f=>ml+(f-.5)*cw,FLX=f=>ml+f*cw;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><rect width="${w}" height="${h}" fill="white"/>`;
  if(fr===1)o+=`<rect x="${ml-nw}" y="${mt}" width="${nw}" height="${bh}" rx="1" fill="#111"/>`;
  else o+=`<text x="${ml-2*sx}" y="${mt+bh*.5}" text-anchor="end" font-family="monospace" font-size="${7*sx}" fill="#888">${fr}fr</text>`;
  for(let s=0;s<4;s++){const y=SY(s);o+=`<line x1="${ml}" y1="${y}" x2="${ml+bw}" y2="${y}" stroke="#222" stroke-width="${1.8*sx}"/>`;}
  for(let f=1;f<=FC;f++)o+=`<line x1="${FLX(f)}" y1="${mt}" x2="${FLX(f)}" y2="${mt+bh}" stroke="#666" stroke-width="${1.5*sx}"/>`;
  o+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+bh}" stroke="#666" stroke-width="${0.8*sx}"/>`;
  for(let s=0;s<4;s++){const y=SY(s),st=ss2[s],sx2=ml-nw-4*sx;if(st==='open')o+=`<circle cx="${sx2}" cy="${y}" r="${dr*.44}" fill="none" stroke="#3a7a3a" stroke-width="1.2"/>`;else if(st==='mute'){const d=dr*.36;o+=`<line x1="${sx2-d}" y1="${y-d}" x2="${sx2+d}" y2="${y+d}" stroke="#cc3333" stroke-width="1.2"/><line x1="${sx2+d}" y1="${y-d}" x2="${sx2-d}" y2="${y+d}" stroke="#cc3333" stroke-width="1.2"/>`;}}
  for(let f=1;f<=FC;f++){const af=fr+f-1;if(!PM.includes(af))continue;const x=FCX(f),y=mt+bh+18*sy,r=dr*.32;if(af===DM){const sp=dr*.5;o+=`<circle cx="${x-sp}" cy="${y}" r="${r}" fill="#b0a090"/><circle cx="${x+sp}" cy="${y}" r="${r}" fill="#b0a090"/>"`;}else o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#b0a090"/>`;}
  dots.filter(d=>d.t==='barre').forEach(d=>{const x=FCX(d.f),y1=SY(d.s),y2=SY(d.e);o+=`<rect x="${x-dr}" y="${y1-dr}" width="${dr*2}" height="${y2-y1+dr*2}" rx="${dr}" fill="#111"/><text x="${x}" y="${(y1+y2)/2+3*sy}" text-anchor="middle" font-family="monospace" font-size="${7*sx}" fill="white" font-weight="700">${fr+d.f-1}</text>`;});
  [{t:'dot',f:'#111'},{t:'tension',f:'#b8620a'}].forEach(({t,f})=>{dots.filter(d=>d.t===t).forEach(d=>{const x=FCX(d.f),y=SY(d.s);o+=`<circle cx="${x}" cy="${y}" r="${dr}" fill="${f}"/><text x="${x}" y="${y+3*sy}" text-anchor="middle" font-family="monospace" font-size="${7*sx}" fill="white" font-weight="700">${fr+d.f-1}</text>`;});});
  return o+'</svg>';
}

function drawDiagCanvas(chord,w,h){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
  const sx=w/SW,sy=h/SH,ml=ML*sx,mt=MT*sy,bw=w-ml-MR*sx,bh=h-mt-MB*sy,dr=7*sx,nw=4.5*sx,fr=chord.startFret||1;
  const SY=s=>mt+s*(bh/3),FCX=f=>ml+(f-.5)*(bw/FC),FLX=f=>ml+f*(bw/FC);
  c.fillStyle='#fff';c.fillRect(0,0,w,h);
  if(fr===1){c.fillStyle='#111';rrC(c,ml-nw,mt,nw,bh,1.5);c.fill();}else{c.fillStyle='#888';c.font=`${7*sx}px monospace`;c.textAlign='right';c.textBaseline='middle';c.fillText(fr+'fr',ml-2*sx,mt+bh*.5);}
  c.strokeStyle='#222';c.lineWidth=1.8*sx;for(let s=0;s<4;s++){const y=SY(s);c.beginPath();c.moveTo(ml,y);c.lineTo(ml+bw,y);c.stroke();}
  c.strokeStyle='#666';c.lineWidth=1.5*sx;for(let f=1;f<=FC;f++){const x=FLX(f);c.beginPath();c.moveTo(x,mt);c.lineTo(x,mt+bh);c.stroke();}
  c.lineWidth=0.8*sx;c.beginPath();c.moveTo(ml,mt);c.lineTo(ml,mt+bh);c.stroke();
  for(let s=0;s<4;s++){const y=SY(s),st=(chord.stringStates||[])[s]||'none',sx2=ml-nw-4*sx;if(st==='open'){c.strokeStyle='#3a7a3a';c.lineWidth=1.2;c.beginPath();c.arc(sx2,y,dr*.44,0,Math.PI*2);c.stroke();}else if(st==='mute'){const d=dr*.36;c.strokeStyle='#cc3333';c.lineWidth=1.2;c.beginPath();c.moveTo(sx2-d,y-d);c.lineTo(sx2+d,y+d);c.stroke();c.beginPath();c.moveTo(sx2+d,y-d);c.lineTo(sx2-d,y+d);c.stroke();}}
  for(let f=1;f<=FC;f++){const af=fr+f-1;if(!PM.includes(af))continue;const x=FCX(f),y=mt+bh+18*sy,r=dr*.32;c.fillStyle='#b0a090';if(af===DM){const sp=dr*.5;c.beginPath();c.arc(x-sp,y,r,0,Math.PI*2);c.fill();c.beginPath();c.arc(x+sp,y,r,0,Math.PI*2);c.fill();}else{c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}}
  (chord.dots||[]).filter(d=>d.t==='barre').forEach(d=>{const x=FCX(d.f),y1=SY(d.s),y2=SY(d.e);c.fillStyle='#111';rrC(c,x-dr,y1-dr,dr*2,y2-y1+dr*2,dr);c.fill();c.fillStyle='#fff';c.font=`bold ${7*sx}px monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(fr+d.f-1,x,(y1+y2)/2);});
  [{t:'dot',f:'#111'},{t:'tension',f:'#b8620a'}].forEach(({t,f})=>{(chord.dots||[]).filter(d=>d.t===t).forEach(d=>{const x=FCX(d.f),y=SY(d.s);c.fillStyle=f;c.beginPath();c.arc(x,y,dr,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.font=`bold ${7*sx}px monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(fr+d.f-1,x,y);});});
  return cv;
}
function rrC(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

let selectedChordKey=null;
function rendPalette(){
  const wrap=document.getElementById('chordPalette');wrap.innerHTML='';
  if(!chords.length){wrap.innerHTML='<div class="empty-p">아직 코드가 없습니다.<br>아래 직접 입력을 사용하세요.</div>';return;}
  chords.forEach(ch=>{
    const div=document.createElement('div');div.className='pc';div.dataset.key=ch.key;
    div.innerHTML=`<div class="pc-name">${ch.name.split(' ')[0]}</div>`;
    if(ch.name.includes(' ')){const t=document.createElement('div');t.className='pc-tens';t.textContent=ch.name.split(' ').slice(1).join(' ');div.appendChild(t);}
    if(ch.hasDiag)div.innerHTML+=mkSVG(ch.dots,ch.stringStates,ch.startFret,56,32);
    div.onclick=()=>{selectedChordKey=ch.key;rendPalette();};
    if(selectedChordKey===ch.key)div.style.borderColor='#b8620a';
    wrap.appendChild(div);
  });
}

function addManualChord(){
  const nm=document.getElementById('manualChordName').value.trim();if(!nm)return;
  document.getElementById('manualChordName').value='';
  const key='m_'+Date.now();
  chords.push({key,name:nm,hasDiag:false,dots:[],stringStates:['none','none','none','none'],startFret:1});
  rendPalette();
}

function newMeasure(){return{chordKeys:[''],lyric:''};}
function addRow(){rows.push({measures:[newMeasure(),newMeasure(),newMeasure(),newMeasure()]});rendRows();}
function delRow(ri){rows.splice(ri,1);rendRows();}
function addMeasureToRow(ri){rows[ri].measures.push(newMeasure());rendRows();}
function delMeasure(ri,mi){rows[ri].measures.splice(mi,1);if(!rows[ri].measures.length)rows.splice(ri,1);rendRows();}
function addChordToMeasure(ri,mi){rows[ri].measures[mi].chordKeys.push('');rendRows();}
function removeChordFromMeasure(ri,mi,ci){rows[ri].measures[mi].chordKeys.splice(ci,1);if(!rows[ri].measures[mi].chordKeys.length)rows[ri].measures[mi].chordKeys=[''];rendRows();}

function rendRows(){
  const wrap=document.getElementById('scoreRows');wrap.innerHTML='';
  if(!rows.length){wrap.innerHTML='<div style="font-family:Menlo,monospace;font-size:.72rem;color:#c0b0a0;padding:1rem;text-align:center">「＋ 행 추가」로 악보를 시작하세요</div>';return;}
  rows.forEach((row,ri)=>{
    const rowDiv=document.createElement('div');rowDiv.className='score-row';
    rowDiv.innerHTML=`<div class="row-label">행 ${ri+1}</div>`;
    const measWrap=document.createElement('div');measWrap.className='measures-edit';
    row.measures.forEach((m,mi)=>{
      if(!m.chordKeys)m.chordKeys=[m.chordKey||''];
      const mDiv=document.createElement('div');mDiv.className='measure-edit';
      const mnum=document.createElement('div');mnum.className='me-num';mnum.textContent=`${ri*4+mi+1}마디`;mDiv.appendChild(mnum);
      m.chordKeys.forEach((ck,ci)=>{
        const crow=document.createElement('div');crow.className='me-chord-row';crow.style.cssText='display:flex;align-items:center;gap:3px;margin-bottom:2px';
        const sel=document.createElement('select');sel.className='me-chord-sel';
        sel.innerHTML='<option value="">— 없음 —</option>'+chords.map(c=>`<option value="${c.key}"${c.key===ck?' selected':''}>${c.name}</option>`).join('');
        sel.addEventListener('change',e=>{rows[ri].measures[mi].chordKeys[ci]=e.target.value;const dw=crow.querySelector('.me-diag');if(dw)dw.remove();const nch=chords.find(c=>c.key===e.target.value);if(nch&&nch.hasDiag){const dWrap=document.createElement('div');dWrap.className='me-diag';dWrap.innerHTML=mkSVG(nch.dots,nch.stringStates,nch.startFret,48,28);crow.appendChild(dWrap);}});
        crow.appendChild(sel);
        const ch=chords.find(c=>c.key===ck);
        if(ch&&ch.hasDiag){const dWrap=document.createElement('div');dWrap.className='me-diag';dWrap.innerHTML=mkSVG(ch.dots,ch.stringStates,ch.startFret,48,28);crow.appendChild(dWrap);}
        if(m.chordKeys.length>1){const rmBtn=document.createElement('button');rmBtn.style.cssText='font-size:.55rem;background:transparent;border:none;color:#d8cfc0;cursor:pointer;padding:0 2px;line-height:1';rmBtn.textContent='－';rmBtn.onclick=e=>{e.stopPropagation();removeChordFromMeasure(ri,mi,ci);};crow.appendChild(rmBtn);}
        mDiv.appendChild(crow);
      });
      const addCBtn=document.createElement('button');addCBtn.style.cssText='font-family:Menlo,monospace;font-size:.55rem;background:transparent;border:1px dashed #d8cfc0;color:#b0a090;border-radius:3px;padding:1px 5px;cursor:pointer;width:100%;margin-bottom:2px';addCBtn.textContent='＋ 코드 추가';addCBtn.onclick=e=>{e.stopPropagation();addChordToMeasure(ri,mi);};mDiv.appendChild(addCBtn);
      mDiv.onclick=e=>{if(['SELECT','OPTION','INPUT','BUTTON'].includes(e.target.tagName))return;if(!selectedChordKey)return;const emptyIdx=m.chordKeys.findIndex(k=>!k);if(emptyIdx>=0)m.chordKeys[emptyIdx]=selectedChordKey;else m.chordKeys.push(selectedChordKey);rendRows();};
      const lyricIn=document.createElement('input');lyricIn.className='me-lyric';lyricIn.type='text';lyricIn.placeholder='가사...';lyricIn.value=m.lyric||'';lyricIn.oninput=e=>{rows[ri].measures[mi].lyric=e.target.value;};mDiv.appendChild(lyricIn);
      const del=document.createElement('button');del.className='me-del';del.textContent='✕';del.onclick=e=>{e.stopPropagation();delMeasure(ri,mi);};mDiv.appendChild(del);
      measWrap.appendChild(mDiv);
    });
    rowDiv.appendChild(measWrap);
    const acts=document.createElement('div');acts.className='row-actions';
    acts.innerHTML=`<button class="btn btn-g btn-sm" onclick="addMeasureToRow(${ri})">＋ 마디</button><button class="btn btn-g btn-sm" style="color:#cc6633;border-color:#884422" onclick="delRow(${ri})">행 삭제</button>`;
    rowDiv.appendChild(acts);wrap.appendChild(rowDiv);
  });
}

async function genPreview(){
  if(!rows.length){alert('악보가 없습니다.');return;}
  const pov=document.getElementById('pov'),pmsg=document.getElementById('pmsg');
  pov.classList.add('show');pmsg.textContent='악보 생성 중...';await tick();
  const PW=1240,PH=1754,LM=52,RM=52,TM=80,BM=60,TITLE_H=80,INNER_W=PW-LM-RM;
  const DIAG_W=56,DIAG_H=32,ABOVE=58,BELOW=26,ROW_H=ABOVE+BELOW+6,ROW_GAP=16;
  const title=document.getElementById('scoreTitle').value||'우쿨렐레 악보';
  const artist=document.getElementById('scoreArtist').value||'';
  const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,PW,PH);
  c.fillStyle='#1a1410';c.font='bold 32px Georgia,serif';c.textAlign='center';c.textBaseline='middle';c.fillText(title,PW/2,TM+24);
  if(artist){c.font='17px -apple-system,Helvetica Neue,Arial,sans-serif';c.fillStyle='#5a4a3a';c.textAlign='right';c.textBaseline='middle';c.fillText(artist,PW-120,TM+56);}
  const startY=TM+TITLE_H;
  for(let ri=0;ri<rows.length;ri++){
    pmsg.textContent=`행 ${ri+1}/${rows.length} 렌더링...`;await tick();
    const rowY=startY+ri*(ROW_H+ROW_GAP);if(rowY+ROW_H>PH-BM)break;
    const lineY=rowY+ABOVE,measures=rows[ri].measures,N=measures.length||1,mW=INNER_W/N;
    c.strokeStyle='#1a1410';c.lineWidth=1.8;c.beginPath();c.moveTo(LM,lineY);c.lineTo(LM+INNER_W,lineY);c.stroke();
    c.strokeStyle='#1a1410';c.lineWidth=2.5;c.beginPath();c.moveTo(LM,lineY-ABOVE+4);c.lineTo(LM,lineY+14);c.stroke();
    for(let mi=0;mi<N;mi++){
      const m=measures[mi];if(!m.chordKeys)m.chordKeys=[m.chordKey||''];
      const mx=LM+mi*mW,validKeys=m.chordKeys.filter(k=>k),nCodes=validKeys.length||1,codeSlotW=mW/nCodes;
      validKeys.forEach((ck,ci)=>{
        const ch=chords.find(c2=>c2.key===ck);if(!ch)return;
        const cx=mx+ci*codeSlotW,cname=ch.name.split(' ')[0],tens=ch.name.split(' ').slice(1).join(' ');
        c.fillStyle='#1a1410';c.font='bold 15px Georgia,serif';c.textAlign='left';c.textBaseline='bottom';c.fillText(cname,cx+4,lineY-2);
        if(tens){const cnW=c.measureText(cname).width;c.fillStyle='#b8620a';c.font='bold 8px monospace';c.fillText(tens,cx+4+cnW+2,lineY-10);}
        if(ch.hasDiag){c.font='bold 15px Georgia,serif';const cnW=c.measureText(cname).width,diagX=cx+4+cnW+6,diagY=lineY-DIAG_H-2,maxDW=Math.min(DIAG_W,codeSlotW-cnW-20);if(maxDW>20){const dRatio=DIAG_H/DIAG_W,dcv=drawDiagCanvas(ch,maxDW*2,maxDW*2*dRatio);c.drawImage(dcv,diagX,diagY,maxDW,maxDW*dRatio);}}
      });
      if(m.lyric){c.fillStyle='#1a1410';c.font='14px -apple-system,Helvetica Neue,Arial,sans-serif';c.textAlign='left';c.textBaseline='top';c.fillText(m.lyric,mx+4,lineY+8);}
      c.strokeStyle='#1a1410';c.lineWidth=mi===N-1?2.5:1.2;c.beginPath();c.moveTo(mx+mW,lineY-ABOVE+4);c.lineTo(mx+mW,lineY+14);c.stroke();
    }
  }
  pov.classList.remove('show');
  const dataUrl=cv.toDataURL('image/jpeg',0.95),panel=document.getElementById('previewPanel');
  panel.classList.add('show');const old=panel.querySelector('img');if(old)old.remove();
  const img=new Image();img.src=dataUrl;img.style.cssText='max-width:100%;border-radius:6px;border:1px solid #d8cfc0;display:block;margin-top:4px';
  panel.appendChild(img);img.scrollIntoView({behavior:'smooth'});
}

let miniDots=[],miniMode='dot',miniSS=['none','none','none','none'];
function setMiniMode(m,btn){
  miniMode=m;
  document.querySelectorAll('#miniEditorWrap .btn[data-m]').forEach(b=>{b.style.background='transparent';b.style.color='#8a7d6e';b.style.borderColor='#d8cfc0';});
  if(m==='dot'){btn.style.background='#1a1410';btn.style.color='#fff';btn.style.borderColor='#1a1410';}
  else if(m==='tension'){btn.style.background='#b8620a';btn.style.color='#fff';btn.style.borderColor='#b8620a';}
  else{btn.style.background='#7a3a3a';btn.style.color='#fff';btn.style.borderColor='#7a3a3a';}
}
function rendMiniSS(){
  const wrap=document.getElementById('miniSSRow');wrap.innerHTML='';
  const sym={none:'─',open:'○',mute:'✕'};
  STR.forEach((s,i)=>{
    const item=document.createElement('div');item.style.cssText='display:flex;flex-direction:column;align-items:center;gap:2px';
    item.innerHTML=`<span style="font-family:monospace;font-size:.5rem;color:#8a7d6e">${s}</span>`;
    const btn=document.createElement('button');btn.style.cssText='width:22px;height:18px;border-radius:3px;border:1.5px solid #d8cfc0;background:#fff;font-size:.62rem;cursor:pointer;display:flex;align-items:center;justify-content:center;';
    btn.textContent=sym[miniSS[i]];
    if(miniSS[i]==='open'){btn.style.color='#3a7a3a';btn.style.borderColor='#3a7a3a';}
    else if(miniSS[i]==='mute'){btn.style.color='#7a3a3a';btn.style.borderColor='#7a3a3a';}
    else btn.style.color='#8a7d6e';
    btn.onclick=()=>{const o=['none','open','mute'];miniSS[i]=o[(o.indexOf(miniSS[i])+1)%3];rendMiniSS();rendMiniSvg();};
    item.appendChild(btn);wrap.appendChild(item);
  });
}
function rendMiniSvg(){
  const fr=parseInt(document.getElementById('miniStartFret').value)||1;
  const wrap=document.getElementById('miniSvgWrap');wrap.innerHTML=mkSVG(miniDots,miniSS,fr,160,90);
  const svg=wrap.querySelector('svg');svg.style.cursor='crosshair';svg.addEventListener('click',onMiniClick);
}
function onMiniClick(ev){
  const svg=ev.currentTarget,r=svg.getBoundingClientRect();
  const px=(ev.clientX-r.left)*(SW/r.width),py=(ev.clientY-r.top)*(SH/r.height);
  if(px<ML||px>ML+BW)return;
  const f=Math.floor((px-ML)/CW)+1;if(f<1||f>FC)return;
  let bestS=-1,md=Infinity;for(let s=0;s<4;s++){const d=Math.abs(py-(MT+s*RH));if(d<md){md=d;bestS=s;}}
  if(md>RH*.7)return;
  const cell={s:bestS,f};
  if(miniMode==='erase')miniDots=miniDots.filter(d=>!(d.s===cell.s&&d.f===cell.f));
  else{const idx=miniDots.findIndex(d=>d.s===cell.s&&d.f===cell.f);if(idx>=0)miniDots.splice(idx,1);else miniDots.push({s:cell.s,f:cell.f,t:miniMode==='tension'?'tension':'dot'});}
  rendMiniSvg();
}
function clearMiniDots(){miniDots=[];miniSS=['none','none','none','none'];rendMiniSS();rendMiniSvg();}
function saveMiniChord(){
  const nm=document.getElementById('miniChordName').value.trim();if(!nm){alert('코드명을 입력해주세요.');return;}
  const fr=parseInt(document.getElementById('miniStartFret').value)||1,key='mini_'+Date.now();
  chords.push({key,name:nm,hasDiag:true,dots:JSON.parse(JSON.stringify(miniDots)),stringStates:[...miniSS],startFret:fr});
  rendPalette();miniDots=[];miniSS=['none','none','none','none'];document.getElementById('miniChordName').value='';rendMiniSS();rendMiniSvg();
}
document.getElementById('miniStartFret').onchange=rendMiniSvg;
function tick(){return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
loadFromBuilder();rendPalette();rendRows();rendMiniSS();rendMiniSvg();
</script>
